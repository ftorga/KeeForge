name: OneDrive uncertain PUT regression
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Verify source
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Configure
        env:
          DROPBOX_APP_KEY: ciplaceholderdropboxappkey
        run: |
          set -eu
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          brew install xcodegen
          BOOTSTRAP_LOCAL_CONFIG_FROM_ENV=1 ./ci_scripts/prepare_build_config.sh .
          xcodegen generate
      - name: Run regression
        run: |
          set -uo pipefail
          mkdir -p build
          xcodebuild test -project KeeForge.xcodeproj -scheme KeeForge -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath build/DerivedData -resultBundlePath build/result.xcresult -parallel-testing-enabled NO -only-testing:KeeForgeTests/OneDriveCloudProviderTests/testSimplePut412AfterUnobservedCommitRemainsUncertain -skipPackagePluginValidation 2>&1 | tee build/test.log
          status=${PIPESTATUS[0]}
          python3 ci_scripts/validate_xcresult_summary.py --result-bundle build/result.xcresult --suite KeeForgeTests --xcodebuild-exit "$status" || exit 1
          xcrun xcresulttool get test-results summary --path build/result.xcresult --compact > build/summary.json
          python3 -c 'import json; d=json.load(open("build/summary.json")); assert d["passedTests"] == 1 and d["failedTests"] == 0 and d["skippedTests"] == 0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: onedrive-regression
          path: |
            build/test.log
            build/summary.json
          retention-days: 7
